name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COREPACK_HOME: ${{ github.workspace }}/.local/corepack
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start with ordinary Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: Bootstrap frozen dependencies and project Node
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Verify managed runtime without changing ordinary Node
        run: |
          test "$(node --version)" = 'v22.22.0'
          test "$(pnpm config get engine-strict)" = 'true'
          test "$(pnpm config get minimum-release-age)" = '1440'
          test "$(pnpm exec node --version)" = "v$(cat .node-version)"
          pnpm runtime:check
          test "$(node --version)" = 'v22.22.0'
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COREPACK_HOME: ${{ github.workspace }}/.local/corepack
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: '.python-version'
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Validate, test and build static public output
        run: sh scripts/check_deployment.sh
      - name: Install the pinned Chromium headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify Lab browser regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
        run: pnpm test:browser
  seo-geo:
    name: seo-geo
    needs: [foundation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the full build including SEO and GEO regression contracts
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
        run: test "$FOUNDATION_RESULT" = success
